name: joi-bio
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - requests
  - pyyaml
  - rdkit
  # vina / openbabel 은 conda-forge 바이너리를 쓴다.
  # pip install vina 는 Boost 1.83+ 의 deprecated 헤더 때문에 빌드가 깨진다.
  - vina
  - openbabel
  # meeko 도 conda-forge 에서 받는다. pip 로 받으면 import 시점에 필요한
  # scipy / gemmi 가 따라오지 않아 리간드 준비가 조용히 전부 실패한다.
  - meeko
  # meeko 가 import 하는 것들 — conda 가 알아서 끌어오지만 명시해 둔다.
  - scipy
  - gemmi
