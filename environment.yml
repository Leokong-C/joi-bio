name: joi-bio
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy          # meeko가 scipy.spatial을 요구한다. 없으면 리간드 준비가 전부 실패한다.
  - requests
  - pyyaml
  - rdkit
  # vina / openbabel 은 conda-forge 바이너리를 쓴다.
  # pip install vina 는 Boost 1.83+ 의 deprecated 헤더 때문에 빌드가 깨진다.
  - vina
  - openbabel
  - pip
  - pip:
      - meeko>=0.6.0
