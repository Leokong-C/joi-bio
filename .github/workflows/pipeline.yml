name: Joi_bio pipeline

on:
  workflow_dispatch:
    inputs:
      gene:
        description: "타깃 유전자 (예: EPAS1) 또는 all"
        required: true
        default: EPAS1
      n_decoys:
        description: "decoy 수"
        required: false
        default: "2000"
      max_ligands:
        description: "샤드당 리간드 상한 (0=전체)"
        required: false
        default: "0"
      exhaustiveness:
        description: "Vina exhaustiveness (높을수록 정확·느림)"
        required: false
        default: "8"

permissions:
  contents: read

jobs:
  prep:
    name: 구조·라이브러리 준비
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      genes: ${{ steps.genes.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: 타깃 목록 결정
        id: genes
        shell: bash -el {0}
        run: |
          if [ "${{ inputs.gene }}" = "all" ]; then
            LIST=$(python -c "
          import yaml, json
          t = yaml.safe_load(open('config/targets.yaml'))['targets']
          t.sort(key=lambda x: x.get('priority', 99))
          print(json.dumps([x['gene'] for x in t]))")
          else
            LIST='["${{ inputs.gene }}"]'
          fi
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "타깃: $LIST"

      - name: Stage 01 — 구조 확보와 포켓 정의
        shell: bash -el {0}
        run: |
          for g in $(echo '${{ steps.genes.outputs.list }}' | python -c "import sys,json;print(' '.join(json.load(sys.stdin)))"); do
            python -m core.structure.fetch --gene "$g"
          done

      - name: Stage 02 — 라이브러리 구성
        shell: bash -el {0}
        run: |
          for g in $(echo '${{ steps.genes.outputs.list }}' | python -c "import sys,json;print(' '.join(json.load(sys.stdin)))"); do
            python -m modules.small_molecule.library --gene "$g" --n-decoys ${{ inputs.n_decoys }}
          done

      - uses: actions/upload-artifact@v4
        with:
          name: prepared
          path: targets/
          retention-days: 7

  dock:
    name: 도킹
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        gene: ${{ fromJson(needs.prep.outputs.genes) }}
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - uses: actions/download-artifact@v4
        with:
          name: prepared
          path: targets/

      - name: 환경 확인
        shell: bash -el {0}
        run: |
          python -c "import vina, meeko, rdkit; print('vina/meeko/rdkit OK')"
          obabel -V

      - name: Stage 03 — Vina 도킹
        shell: bash -el {0}
        run: |
          python -m modules.small_molecule.dock \
            --gene ${{ matrix.gene }} \
            --shard ${{ matrix.shard }} --n-shards 4 \
            --max-ligands ${{ inputs.max_ligands }} \
            --exhaustiveness ${{ inputs.exhaustiveness }}

      - uses: actions/upload-artifact@v4
        with:
          name: docked-${{ matrix.gene }}-${{ matrix.shard }}
          path: targets/${{ matrix.gene }}/docked_shard*.jsonl
          retention-days: 7

  report:
    name: 검증·보고서
    needs: [prep, dock]
    if: always() && needs.prep.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/dl

      - name: 결과 수집
        shell: bash -el {0}
        run: |
          mkdir -p targets
          cp -r /tmp/dl/prepared/* targets/ 2>/dev/null || true
          for d in /tmp/dl/docked-*; do
            [ -d "$d" ] || continue
            base=$(basename "$d")          # docked-<GENE>-<shard>
            g=$(echo "$base" | sed -E 's/^docked-(.+)-[0-9]+$/\1/')
            mkdir -p "targets/$g"
            cp "$d"/*.jsonl "targets/$g/" 2>/dev/null || true
          done
          echo "수집된 타깃:"; ls targets

      - name: Stage 04-05 — 검증 게이트와 ADMET
        shell: bash -el {0}
        run: |
          for g in $(ls targets); do
            echo "::group::$g"
            python -m core.validation.gate --gene "$g" || { echo "검증 건너뜀: $g"; echo "::endgroup::"; continue; }
            python -m modules.small_molecule.admet --gene "$g" || true
            echo "::endgroup::"
          done

      - name: Stage 06 — 보고서
        shell: bash -el {0}
        run: python -m core.report.build

      - uses: actions/upload-artifact@v4
        with:
          name: joi-bio-report
          path: |
            results/
            targets/*/validation.json
            targets/*/candidates.jsonl
            targets/*/target_meta.json
          retention-days: 30

      - name: 요약 출력
        run: cat results/report.md >> $GITHUB_STEP_SUMMARY
