name: Joi_bio zinc probe

# ZINC 접근 가능성 탐침. 도킹 없음 — 1~3 러너분.
#
# 왜: ChEMBL 무작위 풀에 PT 서명을 모두 가진 화합물이 0개였다. 맞출 상대가
# 없으면 물성 매칭 decoy 가 작동하지 않는다. DUD-E 가 쓰는 ZINC 로 갈 수
# 있는지 실제로 두드려 본다.
#
# Claude 가 도는 컨테이너는 아웃바운드가 막혀 있어 여기서만 확인된다.

on:
  workflow_dispatch:
    inputs:
      sample_count:
        description: "무작위 표본 수 — 화학형 분포를 세는 데 쓴다"
        required: false
        default: "2000"

permissions:
  contents: write

jobs:
  probe:
    name: ZINC 탐침
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성
        run: pip install --quiet requests rdkit

      - name: 탐침
        shell: bash
        run: |
          mkdir -p logs zinc_out
          set -o pipefail
          python -u scripts/probe_zinc.py \
            --sample-count ${{ inputs.sample_count }} \
            --out zinc_out/zinc_probe.json 2>&1 | tee logs/zinc_probe.log

      - name: 결과를 ci-results 로
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DEST=$RUNNER_TEMP/ci
          git clone --quiet --depth 1 --branch ci-results \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$DEST"
          OUT="$DEST/runs/${GITHUB_RUN_ID}/zinc-probe"
          mkdir -p "$OUT"
          cp -r zinc_out logs "$OUT/" 2>/dev/null || true
          cd "$DEST" && git add -A
          git -c user.name=joi-bio-ci -c user.email=ci@joi-bio \
            commit -q -m "zinc probe" || exit 0
          git push --quiet origin ci-results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zinc-probe
          path: |
            zinc_out/
            logs/
          retention-days: 30
